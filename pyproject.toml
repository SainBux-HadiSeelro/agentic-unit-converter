[project]
name = "omniconvert-ai"
version = "2.0.0"
description = "Autonomous Multilingual Unit Intelligence & 24/7 AI Copilot"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Hadi Seelro", email = "hadiseelro@example.com" }
]
dependencies = [
    "streamlit>=1.42.0",
    "pandas>=2.2.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "pytest>=8.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
